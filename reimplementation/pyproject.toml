[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gvpwm-reimplementation"
version = "0.1.0"
description = "Reference reimplementation of GVP-WM from arXiv:2602.01960."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.7",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8",
  "pytest>=8.0",
]

[project.scripts]
gvpwm-toy-demo = "gvpwm.examples.toy_demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
